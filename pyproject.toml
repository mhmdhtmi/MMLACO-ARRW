[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmlaco-arrw"
version = "1.0.0"
description = "Mutual-information-based multi-label feature selection with adaptive relevance-redundancy weighting"
requires-python = ">=3.10,<3.11"
license = {text = "MIT"}
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.2",
  "scipy==1.13.1",
  "scikit-learn==1.4.2",
  "scikit-multilearn==0.2.0"
]
